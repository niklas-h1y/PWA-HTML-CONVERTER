<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="A simple tool to update the first base href in an HTML file.">
  <title>Base URL Converter</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20211f; background: #f7f7f5; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
    main { width: min(100%, 560px); }
    .eyebrow { margin: 0 0 12px; color: #777970; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 42px); line-height: 1.08; letter-spacing: -.055em; font-weight: 650; }
    .intro { margin: 13px 0 30px; color: #777970; font-size: 14px; line-height: 1.65; }
    .panel { padding: 24px; border: 1px solid #e7e7e2; border-radius: 16px; background: #fff; box-shadow: 0 12px 40px #20211f08; }
    label { display: block; margin: 0 0 9px; font-size: 13px; font-weight: 600; }
    input[type="url"] { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #dedfd9; border-radius: 9px; outline: none; color: inherit; background: #fff; font: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
    input[type="url"]:focus { border-color: #777970; box-shadow: 0 0 0 3px #77797018; }
    .hint { margin: 8px 0 22px; color: #85877f; font-size: 12px; }
    .dropzone { display: grid; place-items: center; min-height: 148px; padding: 22px; border: 1px dashed #d5d6cf; border-radius: 11px; background: #fafaf8; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
    .dropzone:hover, .dropzone.dragging { border-color: #777970; background: #f4f4f0; }
    .file-icon { display: grid; place-items: center; width: 34px; height: 34px; margin-bottom: 10px; border: 1px solid #e6e7e1; border-radius: 9px; background: white; font-size: 17px; }
    .drop-title { margin: 0; font-size: 13px; font-weight: 600; }
    .drop-sub { margin: 6px 0 0; color: #85877f; font-size: 12px; }
    #fileInput { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
    .file-row { display: none; align-items: center; justify-content: space-between; gap: 12px; margin-top: 13px; padding: 11px 12px; border: 1px solid #ecece7; border-radius: 9px; font-size: 12px; }
    .file-row.visible { display: flex; }
    .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .muted { color: #85877f; white-space: nowrap; }
    button { width: 100%; height: 46px; margin-top: 20px; border: 0; border-radius: 9px; background: #242521; color: white; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; transition: opacity .15s, transform .15s; }
    button:hover:not(:disabled) { opacity: .88; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    #status { min-height: 18px; margin: 13px 0 0; color: #777970; font-size: 12px; line-height: 1.5; }
    #status.error { color: #b33d35; }
    footer { margin-top: 20px; color: #999b93; font-size: 11px; text-align: center; }
    @media (max-width: 480px) { .panel { padding: 19px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A tiny HTML utility</p>
    <h1>Base URL Converter</h1>
    <p class="intro">Choose a destination URL, upload an HTML file, and update its first <code>&lt;base href&gt;</code> tag. Your file stays in your browser.</p>
    <section class="panel" aria-label="HTML converter">
      <label for="baseUrl">New base URL</label>
      <input id="baseUrl" type="url" placeholder="https://example.com/" autocomplete="url" spellcheck="false">
      <p class="hint">Include the full URL, including https://</p>
      <label for="fileInput">HTML file</label>
      <label class="dropzone" id="dropzone" for="fileInput">
        <span class="file-icon" aria-hidden="true">↥</span>
        <span class="drop-title">Drop your HTML file here</span>
        <span class="drop-sub">or click to browse · .html / .htm</span>
      </label>
      <input id="fileInput" type="file" accept=".html,.htm,text/html">
      <div class="file-row" id="fileRow"><span class="file-name" id="fileName"></span><span class="muted" id="fileSize"></span></div>
      <button id="convertButton" type="button" disabled>Convert &amp; download</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <footer>One tag only · Private, local processing</footer>
  </main>
  <script>
    const fileInput = document.querySelector('#fileInput');
    const baseUrlInput = document.querySelector('#baseUrl');
    const dropzone = document.querySelector('#dropzone');
    const fileRow = document.querySelector('#fileRow');
    const fileName = document.querySelector('#fileName');
    const fileSize = document.querySelector('#fileSize');
    const button = document.querySelector('#convertButton');
    const status = document.querySelector('#status');
    let selectedFile = null;

    function setStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle('error', error);
    }
    function useFile(file) {
      if (!file) return;
      if (!/\.html?$/i.test(file.name) && file.type !== 'text/html') {
        selectedFile = null;
        fileRow.classList.remove('visible');
        button.disabled = true;
        setStatus('Please choose an .html or .htm file.', true);
        return;
      }
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = file.size < 1024 ? file.size + ' B' : (file.size / 1024).toFixed(1) + ' KB';
      fileRow.classList.add('visible');
      button.disabled = false;
      setStatus('');
    }
    fileInput.addEventListener('change', () => useFile(fileInput.files[0]));
    for (const eventName of ['dragenter', 'dragover']) {
      dropzone.addEventListener(eventName, event => { event.preventDefault(); dropzone.classList.add('dragging'); });
    }
    for (const eventName of ['dragleave', 'drop']) {
      dropzone.addEventListener(eventName, event => { event.preventDefault(); dropzone.classList.remove('dragging'); });
    }
    dropzone.addEventListener('drop', event => useFile(event.dataTransfer.files[0]));

    button.addEventListener('click', async () => {
      if (!selectedFile) return;
      let destination;
      try {
        destination = new URL(baseUrlInput.value.trim());
        if (!['http:', 'https:'].includes(destination.protocol)) throw new Error();
      } catch {
        setStatus('Enter a valid http:// or https:// URL first.', true);
        baseUrlInput.focus();
        return;
      }
      try {
        const source = await selectedFile.text();
        // Match only the first base element, regardless of attribute order or quote style.
        const baseTagPattern = /<base\b[^>]*>/i;
        const match = source.match(baseTagPattern);
        if (!match) {
          setStatus('No <base> tag was found. No file was changed.', true);
          return;
        }
        const updatedTag = match[0].replace(/\bhref\s*=\s*(["'])(.*?)\1/i, (_, quote) => 'href=' + quote + destination.href + quote);
        let converted;
        if (updatedTag === match[0]) {
          // The first base tag has no href attribute: add one without touching other tags.
          const insertion = match[0].replace(/\s*\/?\s*>$/, '');
          converted = source.replace(baseTagPattern, insertion + ' href="' + destination.href.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">');
        } else {
          converted = source.replace(baseTagPattern, () => updatedTag);
        }
        const blob = new Blob([converted], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = selectedFile.name;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
        setStatus('Done — updated the first <base> tag and downloaded your file.');
      } catch {
        setStatus('The file could not be read. Please try another HTML file.', true);
      }
    });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
